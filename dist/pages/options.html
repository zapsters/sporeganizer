<!DOCTYPE html>
<html>
  <div class="mainContainer mainContainer-alt account options">
    <header>
      <h1><span>Options</span></h1>
    </header>
    <div class="mainContainer-content">
      <h4>Time Settings</h4>
      <section>
        <span>24 hour time</span>
        <label class="toggle-switch square">
          <input type="checkbox" />
          <span class="slider"></span>
        </label>
      </section>
      <h4>Appearance</h4>
      <section id="appearanceSelect">
        <span id="appearanceSelectCurrentText"></span>
        <img
          id="lightModeBtn"
          src="images/cloud-sun.svg"
          data-appearance="light"
          alt=""
          srcset="" />
        <img id="darkModeBtn" src="images/cloud-moon.svg" data-appearance="dark" alt="" srcset="" />
        <!-- <img src="images/cloud-auto.svg" data-appearance="auto" alt="" srcset="" /> -->
      </section>
    </div>
  </div>
</html>
